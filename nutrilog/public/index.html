<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Solignac Nutrition — Logistique des commandes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= CONNEXION ================= -->
  <section class="ecran" id="ecran-connexion">
    <form class="carte carte-connexion" id="form-connexion" autocomplete="on">
      <div class="logo"><img src="logo-solignac.png" alt="Solignac Nutrition" width="720" height="273" /></div>
      <p class="sous-titre">Logistique des commandes · accès réservé au personnel</p>
      <label>Identifiant<input name="login" type="text" autocomplete="username" required autocapitalize="off" spellcheck="false" /></label>
      <label>Mot de passe<input name="mdp" type="password" autocomplete="current-password" required /></label>
      <p class="erreur" id="erreur-connexion" hidden></p>
      <button class="btn btn-primaire btn-large" type="submit">Se connecter</button>
    </form>
  </section>

  <!-- ================= CHANGEMENT DE MOT DE PASSE (obligatoire à la 1re connexion) ================= -->
  <section class="ecran" id="ecran-mdp" hidden>
    <form class="carte carte-connexion" id="form-mdp" autocomplete="on">
      <h2 class="titre-ecran">Mot de passe</h2>
      <p class="sous-titre" id="mdp-explication">Choisissez un mot de passe personnel (12 caractères minimum, lettres et chiffres).</p>
      <label>Mot de passe actuel<input name="ancien" type="password" autocomplete="current-password" required /></label>
      <label>Nouveau mot de passe<input name="nouveau" type="password" autocomplete="new-password" required minlength="12" /></label>
      <label>Confirmer<input name="confirme" type="password" autocomplete="new-password" required minlength="12" /></label>
      <p class="erreur" id="erreur-mdp" hidden></p>
      <div class="ligne-boutons">
        <button class="btn btn-secondaire" type="button" id="mdp-annuler" hidden>Annuler</button>
        <button class="btn btn-primaire" type="submit">Enregistrer</button>
      </div>
    </form>
  </section>

  <!-- ================= APPLICATION ================= -->
  <div id="app" hidden>
    <header class="entete">
      <div class="entete-gauche">
        <button type="button" class="logo-bouton" id="logo-accueil" title="Retour à l'accueil"><img src="logo-solignac.png" alt="Solignac Nutrition — retour à l'accueil" width="720" height="273" /></button>
        <nav class="onglets" id="onglets"></nav>
      </div>
      <div class="entete-droite">
        <span class="badge-connexion" id="badge-connexion" title="État de la connexion au serveur">●</span>
        <span class="qui" id="qui"></span>
        <button class="btn btn-lien" id="btn-mdp" type="button">Mot de passe</button>
        <button class="btn btn-lien" id="btn-deconnexion" type="button">Déconnexion</button>
      </div>
    </header>
    <main class="contenu" id="contenu"></main>
  </div>

  <!-- ================= FENÊTRE MODALE ================= -->
  <div class="voile" id="voile" hidden>
    <div class="modale" id="modale" role="dialog" aria-modal="true">
      <button class="fermer" id="fermer-modale" type="button" aria-label="Fermer">✕</button>
      <div id="modale-contenu"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
