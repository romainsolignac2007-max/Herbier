<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Herbier — Apprendre & reconnaître les plantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=51" />
</head>
<body>

  <!-- ================= ACCUEIL (animation pilotée au scroll) ================= -->
  <section class="vue active" id="vue-accueil">
    <div class="acc-wrap">
      <div class="acc-scene" id="acc-scene">
        <div class="acc-photos" id="acc-photos">
          <div class="acc-photo" style="background-image:url('images/intro-1.jpg')"></div>
          <div class="acc-photo" style="background-image:url('images/intro-2.jpg')"></div>
          <div class="acc-photo" style="background-image:url('images/intro-3.jpg')"></div>
          <div class="acc-photo" style="background-image:url('images/intro-4.jpg')"></div>
        </div>
        <div class="acc-veil"></div>
        <div class="acc-copy">
          <div class="acc-card">
            <span class="acc-badge">🌿 Herbier</span>
            <h1>Apprenez à reconnaître<br />et à choyer vos plantes</h1>
            <p>Votre encyclopédie vivante : 180 plantes à identifier, découvrir et entretenir.</p>
            <div class="acc-cta">
              <button class="acc-btn" data-aller="vue-recherche">Explorer l'herbier</button>
              <button class="acc-btn-2" data-aller="vue-swipe">Découvrir en swipe 🎬</button>
            </div>
          </div>
        </div>
        <div class="acc-hint" id="acc-hint">Faites défiler ↓</div>
      </div>
    </div>
  </section>

  <!-- ================= RECHERCHE ================= -->
  <section class="vue" id="vue-recherche">
    <div class="vue-entete">
      <h2>🔍 Rechercher une plante</h2>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="recherche" placeholder="Nom, famille, nom latin…" autocomplete="off" />
      </div>
    </div>

    <div class="recherche-corps">
      <aside class="filtres-panel" id="filtres-panel"></aside>
      <div class="recherche-resultats">
        <p class="compteur" id="compteur"></p>
        <main class="grille" id="grille"></main>
        <p class="aucun" id="aucun" hidden>Aucune plante ne correspond à votre recherche 🌱</p>
      </div>
    </div>
  </section>

  <!-- ================= SWIPE (façon TikTok) ================= -->
  <section class="vue" id="vue-swipe">
    <div class="swipe-conteneur" id="swipe-conteneur"></div>
    <div class="swipe-aide" id="swipe-aide">↑ Glissez vers le haut</div>
  </section>

  <!-- ================= QUIZZ ================= -->
  <section class="vue" id="vue-quizz">
    <div class="quizz" id="quizz"></div>
  </section>

  <!-- ================= CLASSEMENT ================= -->
  <section class="vue" id="vue-classement">
    <div class="vue-entete"><h2>🏆 Classement</h2></div>
    <div class="classement" id="classement"></div>
  </section>

  <!-- ================= Fiche détaillée ================= -->
  <div class="overlay" id="overlay" hidden>
    <div class="fiche" id="fiche" role="dialog" aria-modal="true">
      <button class="fermer" id="fermer" aria-label="Fermer">✕</button>
      <div class="fiche-contenu" id="fiche-contenu"></div>
    </div>
  </div>

  <!-- ================= BARRE DE NAVIGATION (bas) ================= -->
  <nav class="barre-nav">
    <button class="nav-item actif" data-aller="vue-accueil">
      <span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span>
    </button>
    <button class="nav-item" data-aller="vue-recherche">
      <span class="nav-ico">🔍</span><span class="nav-lbl">Recherche</span>
    </button>
    <button class="nav-item nav-centre" data-aller="vue-swipe">
      <span class="nav-ico">🎬</span>
    </button>
    <button class="nav-item" data-aller="vue-quizz">
      <span class="nav-ico">❓</span><span class="nav-lbl">Quizz</span>
    </button>
    <button class="nav-item" data-aller="vue-classement">
      <span class="nav-ico">🏆</span><span class="nav-lbl">Classement</span>
    </button>
  </nav>

  <script src="plantes.js?v=51"></script>
  <script src="plantes-nouvelles.js?v=51"></script>
  <script src="tailles.js?v=51"></script>
  <script src="app.js?v=51"></script>
</body>
</html>
